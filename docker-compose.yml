version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: inmeta-db
    environment:
      POSTGRES_USER: inmeta
      POSTGRES_PASSWORD: inmeta_password
      POSTGRES_DB: inmeta_db
    ports:
      - "5432:5432"
    volumes:
      - inmeta-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - inmeta-net

volumes:
  inmeta-pgdata:

networks:
  inmeta-net:
    driver: bridge
