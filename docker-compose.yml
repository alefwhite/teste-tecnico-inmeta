services:
  postgres:
    image: postgres:15-alpine
    container_name: inmeta-db
    environment:
      POSTGRES_USER: inmeta
      POSTGRES_PASSWORD: inmeta_password
      POSTGRES_DB: inmeta_db
    ports:
      - "5432:5432"
    volumes:
      - inmeta-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - inmeta-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inmeta -d inmeta_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: inmeta-api
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://inmeta:inmeta_password@postgres:5432/inmeta_db?schema=public
      JWT_SECRET: your_jwt_secret_key
    ports:
      - "3000:3000"
    volumes:
      - inmeta-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "node_modules/.bin/prisma migrate deploy &&
             node_modules/.bin/tsx prisma/seed.ts &&
             node_modules/.bin/tsx src/server.ts"
    restart: unless-stopped
    networks:
      - inmeta-net

volumes:
  inmeta-pgdata:
  inmeta-uploads:

networks:
  inmeta-net:
    driver: bridge
